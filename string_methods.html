<script>
    let myName = 'olamide mimiola olayemi'; 

    /// split(), concat(), indexOf(), trim(), toLowerCase, match, search, slice, substr, substring, startsWith, endsWith, includes, replace, repeat 

    // indexOf
    console.log(myName.indexOf('m'));
    console.log(myName.indexOf('id'));
    console.log(myName.indexOf('i'));
    console.log(myName.indexOf('q')); // -1
    console.log(myName.indexOf('a o')); // 
    
    console.log(myName.indexOf('mi')); // 3

    // lastIndexOf()
    console.log(myName.lastIndexOf('mi')); // 

    
    let myName2 = 'ola mide'; 

    // concat()
    console.log(myName2.concat(' adeola')); // 'olamide adeola'

    // startsWith
    console.log(myName2.startsWith('ola')); // true
    console.log(myName2.startsWith('Ola')); // false
    console.log(myName2.startsWith('ola m')); // true
    console.log(myName2.startsWith('ola  m')); // false

    // endsWith
    console.log(myName2.endsWith('de')); // true
    console.log(myName2.endsWith('ola mide')); // true

    console.log(myName2.includes('la')); // true
    console.log(myName2.includes('b')); // false

    console.log('ADEOLA'.toLowerCase()); // adeola
    console.log('adeola'.toUpperCase()); // ADEOLA


</script>

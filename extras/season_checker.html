  <body>
    <input type="text" id="month" placeholder="Type month eje" />
    <button onclick="checkers()" id="checker">Check month</button>
    <p id="Outcome"></p>
  </body>

<script>
      let Month = document.getElementById('month')
      let Checker = document.getElementById('checker')

      let outcome = document.getElementById('Outcome')

    function checkers() {

         let MONTH = Month.value.trim().toLowerCase()
         
          // MONTH = MONTH.trim()
          
          if (MONTH === '') {
                   outcome.innerHTML = 'Pls👌enter a valid input'
          }
          else if(MONTH === 'september' || MONTH === 'october' || MONTH === 'november'){

              outcome.innerHTML = 'Season is Autumn'
          }
         else if(MONTH === 'december' || MONTH === 'january' || MONTH === 'february'){

              outcome.innerHTML = 'Season is Winter'
          }
          else if(MONTH === 'march' || MONTH === 'april' || MONTH === 'may'){

              outcome.innerHTML = 'Season is Spring'
          }
          else if(MONTH === 'june' || MONTH === 'august' || MONTH === 'july'){
              outcome.innerHTML = 'Season is Summer'
          }
          else {
            outcome.innerHTML = `${MONTH} is not a valid input`
          }


    }

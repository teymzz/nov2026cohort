<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="textField"> <button onclick="splitText()">Split Text</button>
    <div id="output"></div>
</body>
</html>
<script>

    let string = 'adeola'
    let stringCount = string.length

function splitText() {

 let inputValue = textField.value;

 let inputLength = inputValue.length // lenght of input 
 let halfOfText = Math.trunc(inputLength / 2); 

 let firstPartOfText = inputValue.substring(0, halfOfText)
 let secPartOfText = inputValue.substring(halfOfText)

 output.innerHTML = firstPartOfText + ' + ' + secPartOfText
 
}


</script>

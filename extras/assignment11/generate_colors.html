    function generateColors() {

        let countField = document.getElementById('count'); 
        let count = countField.value.trim() // '' 

        if(count) {

            if(isNaN(count)){
                alert('Please enter a valid number')
            }else{
                count = +count; 

                if(count < 1){
                    
                        alert('Please enter a number that is greater than zero')

                }else {

                    let content = '' 

                    for (let index = 1; index <= count; index++) {
                       
                        // rgb(0, 0 ,0) 0 - 255

                        let r = Math.floor(Math.random() * 256); 
                        let g = Math.floor(Math.random() * 256); 
                        let b = Math.floor(Math.random() * 256); 

                        let rgbColor = `rgb(${r}, ${g}, ${b})`

                        content += `<div class="box" style="background-color:${rgbColor}">${rgbColor}</div>`;

                        // console.log(rgbColor);
                        
                        
                    }

                  let colorField = document.getElementById('color_field')

                  colorField.innerHTML = content




                }

            }

        }else{
            alert('please enter a valid input')
        }

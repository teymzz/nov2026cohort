<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(20, 20, 48);
            color: white;
        }
        input, button {
            outline: none;
            border: solid red;
            padding: 10px;
            background-color: transparent;
            color: white;
        }
        input::placeholder{
            color: white;
        }
        button{
            background-color: red;
        }
    </style>
</head>
<body>

    <div class="input-area">
        <input type="text" id="num1" placeholder="from">
        <input type="text" id="num2" placeholder="to">
        <button onclick="generateTable()">Generate Times Table</button>
    </div>
    <div id="output">

    </div>
    
    <script>

        function generateTable() {

            let num1Element = document.getElementById('num1')
            let num2Element = document.getElementById('num2')

            let num1Value = num1Element.value.trim();
            let num2Value = num2Element.value.trim();

            if(!num1Value || isNaN(num1Value)){
                alert('Please enter a valid number in input 1')
            }else if(!num2Value || isNaN(num2Value)){
                alert('Please enter a valid number in input 2')
            }else{

               num1Value = +num1Value
               num2Value = +num2Value

               if( !Number.isInteger(num1Value) ){
                     alert('First number must be an integer')
               }else if( !Number.isInteger(num2Value) ){
                    alert('Second number must be an integer')
               }else {

                  let timesTable = ''; 

                  if(num1Value > num2Value){

                     for(let i = num1Value;  i >= num2Value; i--){
                        
                            timesTable += `<div class="times-table table${i}">`;
                            timesTable += `<h1>Times Table ${i}</h1>`;
    
                            for(let j = 1; j <= 12; j++){
                                timesTable += (`<div class="operation-item">${i} * ${j} =${i * j}</div>`);
                            }
                            timesTable += '</div>'
                          
                      }
                  }else{

                      for(let i = num1Value;  i <= num2Value; i++){
    
                            timesTable += `<div class="times-table table${i}">`;
                            timesTable += `<h1>Times Table ${i}</h1>`;
    
                            for(let j = 1; j <= 12; j++){
                                timesTable += (`<div class="operation-item">${i} * ${j} =${i * j}</div>`);
                            }
                            timesTable += '</div>'
                          
                      }
                  }


                  document.getElementById('output').innerHTML = timesTable
                 
               }

            }


        }

    </script>

</body>
</html>

<script>
    let num1 = 20; 
    let num2 = 5;

    console.log(num1); // 20
    
    num1 = 30
    console.log(num1); // 30

    // Arithmetic operators 

    console.log(num1 * num2); // 100
    console.log(num1 / num2); // 4
    console.log(num1 + num2); // 25
    console.log(num1 - num2); // 15
    console.log(num1 % num2); // 0 
    console.log(10 ** 3); // 1000 

    // Assigment Operators 
    
    let num3 = 20; 

    console.log(num3); // 20

    // num3 = num3 + 5
    num3 += 5; // 25

    console.log(num3); // 25

    // num3 = num3 - 10
    num3 -= 10;
    console.log(num3); // 15


    num3 /= 5; 
    console.log(num3); // 3


    num3 *= 4; 
    console.log(num3); // 12

    num3 %= 2; 
    console.log(num3); // 0
    







    

    

</script>

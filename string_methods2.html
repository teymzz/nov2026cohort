<script>
    let string1 = '   This is sentence     one   '; 

    /// split(), concat(), indexOf(), trim(), toLowerCase, match, search, slice, substr, substring, startsWith, endsWith, includes, replace, repeat 

    console.log(string1);
    console.log(string1.trimLeft()); // or trimStart()
    console.log(string1.trimRight()); // or trimEnd()

    console.log(string1.trimLeft().trimRight()); //
    console.log(string1.trim()); //

    /// split 

    let string2 = 'This is sentence two'; 
    console.log(string2.split()); // ['This is sentence two']
    console.log(string2.split(' '));

    
    let string3 = 'This is sentence  three'; 
    
    console.log(string3.split('  '));
    
    let string4 = 'This is a book given to me by my brother'; // ['This is a', 'given to me by my brother']

    console.log(string4.split(' book '));

    let string5 = 'This book was given to me by my brother'


    console.log(string5.split('o'));
    console.log(string5.split(''));  

    // Subtring 

    let ourSentence = 'Olamideola'

    console.log(ourSentence.substring(3, 7)); // mide
    console.log(ourSentence.substring(3)); // mideola
    
    console.log(ourSentence.substring(5, -1)); // Olami


    // Substr 
    console.log(ourSentence.substr(3, 4)); // mide
    console.log(ourSentence.substr(3, 5)); // mideo

    console.log(ourSentence.substr(-1)); // a
    console.log(ourSentence.substr(-5)); // deola
    console.log(ourSentence.substr(-5, 3)); // deo

    // Slice 
    console.log(ourSentence.slice(0, 5)); // Olami
    console.log(ourSentence.slice(3));
    console.log(ourSentence.slice(3, 4)); // m
    console.log(ourSentence.slice(-4, 9)); // eol

    // replace 

    let ourString = 'This is a fine book given to me by my friend'

    console.log(ourString);
    console.log(ourString.replace(' book', 'novel'));
    console.log(ourString.replace(' class', 'novel'));

    // Task: replace all words named 'book' in this sentence below to novel 

    let sentence = 'This book given to me by my Mother is a very nice BOOK. It is one of the books I would love to have in my library' 

    // exptected result: 'This novel given to me by my mother is a very nice novel. It is one of the novels I would love to have in my library'

    sentence = sentence.replace('book', 'novel').replace('BOOK', 'novel').replace('books','novels').replace('Mother','mother')

    console.log(sentence); // This novel given to me by my mother is a very nice novel. It is one of the novels I would love to have in my library


    let sentence2 = 'This book is a very nice book';

    console.log(sentence2.replace('book', 'novel').replace('book','novel'));
    console.log(sentence2.replaceAll('book', 'novel'));
    
    
    




    





    

</script>
